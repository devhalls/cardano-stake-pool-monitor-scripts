# Example hosts.yaml
# Multi-host multi-pane setups.
# Adjust the key, username and pane scripts to suit your node setup.
#
# Fleet fields (optional; used by ./scripts/fleet.sh):
#   role:    relay | producer  — required for update ordering (relays first)
#   workdir: remote path containing scripts/node.sh and env
#            If omitted, derived from the first pane script
#            (e.g. "bash Cardano/scripts/node.sh view" → Cardano)

hosts:
  - ip: "xxx.xxx.x.xx"
    title: 'Mainnet Producer'
    user: "upstream"
    key: "~/.ssh/cardano_monitor"
    role: producer
    workdir: "Cardano"
    second_column: "80%"
    panes:
      - script: "bash Cardano/scripts/node.sh view"
        color: "white"
        title: "Mainnet BP"
      - script: "bash Cardano/scripts/node.sh status"
        title: "Service Status"
        color: "white"
        height: "90%"
      - script: "bash Cardano/scripts/node.sh mithril watch"
        title: "Mithril logs"
        color: "white"
        height: "5%"
      - script: "bash Cardano/scripts/node.sh watch"
        title: "Node Logs"
        color: "white"
        height: "5%"
  - ip: "xxx.xxx.x.xx"
    title: 'Mainnet Relay Alpha'
    user: "upstream"
    key: "~/.ssh/cardano_monitor"
    role: relay
    workdir: "Cardano"
    second_column: "80%"
    panes:
      - script: "bash Cardano/scripts/node.sh view"
        color: "white"
        title: "Mainnet Relay"
      - script: "bash Cardano/scripts/node.sh status"
        title: "Service Status"
        color: "white"
        height: "90%"
      - script: "bash Cardano/scripts/node.sh mithril watch_squid"
        title: "Mithril logs"
        color: "white"
        height: "5%"
      - script: "bash Cardano/scripts/node.sh watch"
        title: "Node Logs"
        color: "white"
        height: "5%"
