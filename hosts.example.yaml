# Example hosts.yaml
# Multi-host multi-pane setups.
# Adjust the key, username and pane scripts to suit your node setup.

hosts:
  - ip: "xxx.xxx.x.xx"
    title: 'Mainnet Producer'
    user: "upstream"
    key: "~/.ssh/cardano_monitor"
    second_column: "80%"
    panes:
      - script: "bash Cardano/scripts/node.sh view"
        color: "white"
        title: "Mainnet BP"
      - script: "bash Cardano/scripts/node.sh status"
        title: "Service Status"
        color: "white"
        height: "90%"
      - script: "bash Cardano/scripts/node.sh mithril watch"
        title: "Mithril logs"
        color: "white"
        height: "5%"
      - script: "bash Cardano/scripts/node.sh watch"
        title: "Node Logs"
        color: "white"
        height: "5%"
